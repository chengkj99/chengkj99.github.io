    : url === '/api/demo' ? {"title": "小熊的心情魔法", "book_title": "小熊的心情天气（原创演示）", "age": "4—5岁", "goal": "英语启蒙", "evidence": "原创演示情境，不对应《奇先生妙小姐》等真实绘本中的文字或情节。上传真实书页并配置 AI 后，才会生成基于照片的活动。", "intro": "小熊站在窗边，今天的心情像天气一样变来变去。邀请孩子看一看自己的脸：现在像晴天，还是像小雨天？", "vocab": [{"en": "happy", "zh": "开心", "action": "露出一个大大的笑脸"}, {"en": "sad", "zh": "难过", "action": "用脸做出难过的表情"}, {"en": "smile", "zh": "微笑", "action": "对玩具小熊微笑"}], "questions": ["妈妈说：Show me happy! 你可以用表情来回答吗？", "小熊的玩具丢了，它会是什么心情？你能用表情或话语告诉我吗？"], "game_title": "帮小熊找到心情", "game_materials": "白纸、彩笔、一只玩具熊", "game_steps": ["在白纸上画一张开心脸和一张难过脸。", "家长说 happy / sad，孩子指向或拿起相应的卡片。", "交换角色：孩子替小熊选择心情，并讲讲原因。"], "dice_tasks": [{"emoji": "😊", "label": "表情魔法", "instruction": "听到 happy 就做开心脸，听到 sad 就做难过脸。"}, {"emoji": "🔎", "label": "找一找", "instruction": "找出游戏纸里的开心脸，指出它的嘴巴。"}, {"emoji": "🎭", "label": "演一演", "instruction": "扮演小熊，试着说 I'm happy，或用动作表示。"}, {"emoji": "🧸", "label": "玩具剧场", "instruction": "拿起一只玩具，演出它开心或难过的时候。"}, {"emoji": "🎨", "label": "涂鸦时光", "instruction": "给今天的心情画一朵云或一个太阳。"}, {"emoji": "✨", "label": "自选惊喜", "instruction": "你来决定一个游戏，邀请爸爸妈妈一起玩。"}], "voice_opening": "你好呀！我是绘本魔法盒里的小狐狸。今天我们一起找心情，好不好？请你做一个 happy 的表情！", "parent_hint": "只练 happy、sad 两个核心词。孩子愿意指认、做动作就很好；不要求机械跟读，也不要求难过时必须开心。"}
    : url === '/api/voice/reply' ? {reply:'我听到了！谢谢你和我分享。我们一起看看书里还有什么好玩的吧！',mode:'scripted_demo'}
    : {};
  return new Response(JSON.stringify(content),{status:200,headers:{'Content-Type':'application/json'}});
};

<script>
/* 绘本魔法盒 V0.1. No library dependencies; offline UI demo; server AI is optional. */
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const clone = value => JSON.parse(JSON.stringify(value));
  const STORE_KEY = 'storybook_magic_v01';
  const defaultSaved = {books:[], journal:[], plan:null, approved:false};
  const stored = (() => { try { return {...defaultSaved,...JSON.parse(localStorage.getItem(STORE_KEY)||'{}')}; } catch { return clone(defaultSaved); } })();
  const app = {
    view:'home',config:{ai_enabled:false,voice_mode:'scripted_demo'},loading:false,
    bookTitle:'',age:'4—5岁',goal:'英语启蒙',note:'',images:[],
    plan:stored.plan,approved:stored.approved, books:stored.books||[],journal:stored.journal||[],
    dice:0,diceCount:0,feedback:'喜欢', feedbackNote:'',
    voiceStarted:false, voiceTurns:[], voiceSince:null,voiceBusy:false, recording:false,
    recorder:null,stream:null,currentAudio:null,sessionEnded:false, voiceConsent:false, voiceStyle:'fox',journalDraft:'',
  };
  function save(){try {localStorage.setItem(STORE_KEY,JSON.stringify({books:app.books,journal:app.journal,plan:app.plan,approved:app.approved}));}catch {notify('本机储存已满，可清理一些记录。');}}
  function notify(message){const old=$('.toast');old?.remove();const el=document.createElement('div');el.className='toast';el.textContent=message;document.body.appendChild(el);setTimeout(()=>el.remove(),4400);}
  async function api(url, options={}){const res=await fetch(url,options);let payload=null;const type=res.headers.get('content-type')||'';if(type.includes('json'))payload=await res.json();else payload={};if(!res.ok)throw new Error(typeof payload.detail==='string'?payload.detail:`请求失败 (${res.status})`);return payload;}
  function modeTag(){return app.config.ai_enabled?'<span class="tag">● AI 已连接</span>':'<span class="tag yellow">● 本地体验模式</span>';}
  function sidebar(){const tabs=[['home','⌂','首页'],['create','📷','拍书生成'],['plan','🪄','活动方案'],['play','🎲','游戏陪玩'],['voice','🎙️','语音互动'],['growth','🌱','成长记录']];return `<aside class="sidebar"><div class="brand"><span class="brand-icon">📖</span><div><div class="brand-name">绘本魔法盒</div><div class="brand-sub">让每一本书，都有新玩法</div></div></div><nav class="nav-list" aria-label="主导航">${tabs.map(([id,ico,label])=>`<button class="nav-btn ${app.view===id?'active':''}" data-view="${id}"><span class="nav-ico">${ico}</span><span>${label}</span></button>`).join('')}</nav><div class="sidebar-note"><div class="bear">🧸 🌿</div><h4>用真实的书，玩真实的游戏</h4><p>手机负责准备，纸书和亲子互动才是主角。</p></div></aside>`;}
  function header(){return `<header class="topbar"><div class="greet">🌤️ 今天也适合一起读本书</div><div class="topbar-tools">${modeTag()}<span class="avatar" title="家长模式">👩</span></div></header>`;}
  function bookCover(book,index=0){const bg=['#f6e9dc','#e9f1e3','#f8efcd','#e5e9f7'][index%4];const icon=book.emoji||['🐻','🌈','🦊','🐰'][index%4];return `<div class="book-cover" style="background:${bg}">${esc(icon)}</div>`;}
  function home(){return `<section class="page"><div class="welcome"><h1>早上好，今天想读什么？ 👋</h1><p>从家里的绘本出发，把阅读变成一场小小冒险。</p></div><section class="hero"><div class="hero-copy"><span class="eyebrow">MAGICAL READING TIME</span><h1>每一本书，<br/>都有新玩法。</h1><p>拍下家里的绘本，AI 帮你设计亲子游戏、英文小任务与可以打印的活动纸。</p><button class="btn btn-primary" data-view="create">📷 拍一本书，开始探索 <span>↗</span></button></div><div class="hero-art" aria-hidden="true"><span class="art-circle"></span><span class="art-book">📚</span><span class="art-star">✦</span><span class="art-flower">🌼</span></div></section><section class="stats"><div class="card stat"><div class="stat-icon" style="background:#fff0e2">📚</div><div><div class="stat-value">${app.books.length}</div><div class="stat-label">我的绘本</div></div></div><div class="card stat"><div class="stat-icon" style="background:#e9f2ec">✨</div><div><div class="stat-value">${app.plan?1:0}</div><div class="stat-label">当前活动</div></div></div><div class="card stat"><div class="stat-icon" style="background:#f4eaf3">🌱</div><div><div class="stat-value">${app.journal.length}</div><div class="stat-label">成长记录</div></div></div></section><div class="section-head"><h2>📖 我的绘本小书架</h2><button class="btn btn-text" data-view="create">添加一本 ＋</button></div><div class="book-grid">${app.books.length?app.books.slice(0,6).map((book,i)=>`<button type="button" class="card book-card" style="text-align:left;width:100%" data-book="${i}">${bookCover(book,i)}<div class="book-meta"><div><h3>${esc(book.book_title)}</h3><p>${esc(book.goal||'阅读互动')} · ${esc(book.age||'4—5岁')}</p></div><span class="book-arrow">↗</span></div></button>`).join(''):`<div class="card empty" style="grid-column:1/-1"><div class="emoji">📚</div><h3>小书架还是空的</h3><p>可以先试试原创演示，再拍一本真正属于孩子的绘本。</p><button class="btn btn-primary" data-action="demo">体验演示故事</button></div>`}</div><div class="section-head"><h2>🌟 开始探索的两种方式</h2></div><div class="two-col"><div class="card"><h3>🖨️ 打印出来，动手玩</h3><p class="muted mid" style="margin:10px 0 18px;line-height:1.9">生成家长引导卡、儿童活动纸和六面骰子，打印后就能把屏幕放到一边。</p><button class="btn btn-outline btn-sm" data-view="plan">查看活动方案 →</button></div><div class="card"><h3>🎙️ 和 AI 小伙伴说说话</h3><p class="muted mid" style="margin:10px 0 18px;line-height:1.9">在家长陪伴下进行简短语音游戏，不考试、不强迫跟读。</p><button class="btn btn-outline btn-sm" data-view="voice">开启语音体验 →</button></div></div><p class="footer-note">产品演示数据保存在当前浏览器；已上传图片不会自动保存到本机书架或服务器。儿童使用时请由监护人在旁陪同。</p></section>`;}
  function create(){return `<section class="page"><span class="eyebrow">STEP 01 / ADD A BOOK</span><h1 class="hero-title" style="margin-top:8px">给家里的绘本，施一点魔法 ✨</h1><p class="muted" style="margin:10px 0">先让孩子从书架选一本，再由家长拍下封面和关键跨页。</p><div class="steps"><div class="step on"><span class="number">1</span>上传书页</div><div class="step"><span class="number">2</span>AI生成</div><div class="step"><span class="number">3</span>家长审核</div><div class="step"><span class="number">4</span>打印／语音</div></div><div class="form-grid"><div class="card"><h3>📸 拍下孩子选的绘本</h3><p class="muted mid" style="margin:10px 0 16px;line-height:1.8">封面＋3—5个关键跨页。没拍到的情节，AI 不应该猜。</p><label class="upload-zone" for="book-photo"><div class="upload-icon">📷</div><h3>点击拍照或上传图片</h3><p>支持 JPG / PNG / WebP，最多6张<br/>上传前会在设备上压缩图片</p></label><input id="book-photo" type="file" accept="image/png,image/jpeg,image/webp" capture="environment" multiple hidden/><div class="thumbs">${app.images.map((img,i)=>`<img class="thumb" alt="已选第${i+1}张书页" src="${img}"/>`).join('')}</div>${app.images.length?`<p class="muted small">已选择 ${app.images.length} 张 · <button class="btn btn-text btn-sm" data-action="clear-images">清空照片</button></p>`:''}<div class="field"><label for="book-name">书名</label><input id="book-name" placeholder="例如：我家的一本奇先生妙小姐" value="${esc(app.bookTitle)}" /></div><div class="two-col"><div class="field"><label for="age">年龄</label><select id="age"><option selected>4—5岁</option></select></div><div class="field"><label for="goal">今天的目标</label><select id="goal">${['英语启蒙','故事理解','情绪表达'].map(x=>`<option ${x===app.goal?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label for="parent-note">孩子的兴趣／补充信息（可选）</label><textarea id="parent-note" placeholder="例如：喜欢模仿表情，最近正在学happy和sad">${esc(app.note)}</textarea></div><div class="notice-bar">🔒 照片仅用于生成本次活动，不作为公开电子书展示。使用真实 AI 生成会把所选书页传送到配置的 AI 服务。</div><div class="toolbar"><button class="btn btn-primary" data-action="generate" ${app.loading?'disabled':''}>${app.loading?'<span class="loading-spinner"></span> AI 生成中…':'✨ 生成专属活动'}</button><button class="btn btn-white" data-action="demo">先体验原创演示</button></div></div><aside><div class="card"><h3>🪄 魔法盒会准备什么？</h3><div class="mini-workflow"><div class="mini-flow"><span class="bubble">🔍</span><div><div class="title">识别书页</div><div class="desc">提取真实可见的角色、场景与线索</div></div></div><div class="mini-flow"><span class="bubble">💡</span><div><div class="title">设计互动</div><div class="desc">小年龄、小目标、有动作的趣味任务</div></div></div><div class="mini-flow"><span class="bubble">📝</span><div><div class="title">家长先审核</div><div class="desc">检查真实性与语言，按需修改</div></div></div><div class="mini-flow"><span class="bubble">🎲</span><div><div class="title">打印＋语音</div><div class="desc">同一组任务，有离线和语音两种玩法</div></div></div></div></div><div class="card" style="margin-top:15px;background:#fdf7ec"><h3>🌟 小小提醒</h3><p class="muted mid" style="line-height:1.9;margin-top:12px">不需要拍整本书。优先拍封面、故事开始、人物变化和结尾附近的关键画面。所有 AI 生成内容都应由家长确认后使用。</p></div></aside></div></section>`;}
  function planPage(){if(!app.plan)return missing('还没有活动方案','先拍一本书，或通过原创演示体验完整流程。');const p=app.plan;return `<section class="page"><div class="section-head" style="margin-top:0"><div><span class="eyebrow">STEP 02 / REVIEW & PLAY</span><h1 class="hero-title" style="margin-top:10px">${esc(p.title)} 🪄</h1><p class="muted mid" style="margin-top:7px">${esc(p.book_title)} · ${esc(p.age)} · ${esc(p.goal)}</p></div><span class="tag ${app.approved?'':'yellow'}">${app.approved?'✓ 家长已确认':'待家长审核'}</span></div><div class="notice-bar" style="margin:18px 0"><b>原书依据：</b>${esc(p.evidence)}</div><div class="toolbar"><button class="btn ${app.approved?'btn-white':'btn-primary'}" data-action="edit-plan">✏️ ${app.approved?'重新修改方案':'审核并修改方案'}</button><button class="btn btn-green" data-action="print" ${!app.approved?'disabled':''}>🖨️ 打印活动包</button><button class="btn btn-white" data-view="voice" ${!app.approved?'disabled':''}>🎙️ 进入语音游戏</button></div><div class="plan-grid"><article class="card plan-section" style="grid-column:1/-1"><h3>🌈 今天的英语小词语</h3><div class="vocab-grid">${p.vocab.map(v=>`<div class="vocab"><div class="en">${esc(v.en)}</div><div class="zh">${esc(v.zh)}</div><div class="act">${esc(v.action)}</div></div>`).join('')}</div></article><article class="card plan-section"><h3>📖 ① 故事引入</h3><p>${esc(p.intro)}</p></article><article class="card plan-section"><h3>💬 ② 自然互动</h3><ol>${p.questions.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></article><article class="card plan-section"><h3>🎨 ③ ${esc(p.game_title)}</h3><p style="margin-bottom:9px">准备：${esc(p.game_materials)}</p><ol>${p.game_steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></article><article class="card plan-section"><h3>🎲 ④ 六面魔法骰子</h3><ul>${p.dice_tasks.map(x=>`<li>${esc(x.emoji)} <b>${esc(x.label)}</b> — ${esc(x.instruction)}</li>`).join('')}</ul></article></div><div class="card" style="margin-top:17px;background:#f0f5ee"><h3>💚 家长使用建议</h3><p class="mid" style="color:#6c8274;line-height:1.8;margin-top:8px">${esc(p.parent_hint)}</p></div><div class="bottom-actions"><button class="btn btn-outline" data-view="create">← 换一本书</button><button class="btn btn-primary" data-action="edit-plan">${app.approved?'再次审核':'确认后开始玩'} →</button></div></section>`;}
  function reviewPage(){if(!app.plan)return missing('没有需要审核的内容','请先生成或载入示范活动。');const p=app.plan;return `<section class="page"><span class="eyebrow">PARENT CHECK / 家长专用</span><h1 class="hero-title" style="margin:10px 0 7px">确认孩子要玩的内容</h1><p class="muted mid" style="line-height:1.8">请核对书页依据、词汇、游戏和语音开场。内容只有确认后才能进入孩子的活动页面。</p><div class="review-block"><h3>📚 原书内容依据</h3><textarea id="edit-evidence">${esc(p.evidence)}</textarea><p class="helper">不要将没上传的页码或故事细节写成已核实事实。</p></div><div class="review-grid"><div class="review-block"><h3>活动名称</h3><input id="edit-title" value="${esc(p.title)}"/></div><div class="review-block"><h3>离线游戏标题</h3><input id="edit-game-title" value="${esc(p.game_title)}"/></div></div><div class="review-block"><h3>📖 故事引入</h3><textarea id="edit-intro">${esc(p.intro)}</textarea></div><div class="review-block"><h3>🌈 核心词语（每行：英文 | 中文 | 动作）</h3><textarea id="edit-vocab">${esc(p.vocab.map(v=>`${v.en} | ${v.zh} | ${v.action}`).join('\n'))}</textarea></div><div class="review-grid"><div class="review-block"><h3>💬 互动问题（每行一题）</h3><textarea id="edit-questions">${esc(p.questions.join('\n'))}</textarea></div><div class="review-block"><h3>🧸 离线游戏步骤（每行一步）</h3><textarea id="edit-steps">${esc(p.game_steps.join('\n'))}</textarea></div></div><div class="review-grid"><div class="review-block"><h3>需要准备的材料</h3><input id="edit-materials" value="${esc(p.game_materials)}"/></div><div class="review-block"><h3>🎙️ AI 语音开场</h3><textarea id="edit-opening">${esc(p.voice_opening)}</textarea></div></div><div class="review-block"><h3>🎲 六面骰子的任务（每行：标题 | 任务说明）</h3><textarea id="edit-dice" style="min-height:170px">${esc(p.dice_tasks.map(v=>`${v.label} | ${v.instruction}`).join('\n'))}</textarea><p class="helper">需保留6条。只需修改任务名称和内容，表情图标会沿用原来的。</p></div><div class="review-block"><h3>给家长的温馨提示</h3><textarea id="edit-hint">${esc(p.parent_hint)}</textarea></div><label class="checkrow"><input type="checkbox" id="adult-confirm"/><span>我是家长／监护人，已经核对内容适龄、安全、符合可见书页；会陪同孩子使用语音功能。</span></label><div class="bottom-actions"><button class="btn btn-outline" data-view="plan">← 返回预览</button><button class="btn btn-primary" data-action="approve">✓ 确认并保存</button></div></section>`;}
  function play(){if(!app.approved)return missing('请家长先确认活动','审核和确认完成后，就可以开始掷骰子啦。');const p=app.plan;const task=p.dice_tasks[app.dice]||p.dice_tasks[0];return `<section class="page"><span class="eyebrow">PLAY TIME / 纸书陪玩</span><h1 class="hero-title" style="margin:11px 0 7px">魔法骰子，转起来！ 🎲</h1><p class="muted mid" style="margin-bottom:20px">${esc(p.book_title)} · ${esc(p.goal)} · 今天第 ${app.diceCount} 次摇骰子</p><div class="play-layout"><div class="play-card"><span class="eyebrow" style="color:#a38b60">YOUR MAGIC TASK</span><div class="dice-3d" aria-label="当前骰子面">${esc(task.emoji)}</div><div class="dice-task">${esc(task.label)}</div><p class="description">${esc(task.instruction)}</p><button class="btn btn-primary" style="margin-top:20px;min-width:195px" data-action="roll">🎲 掷骰子，换个玩法</button></div><div class="side-guide"><div class="card"><h3>📖 让书继续当主角</h3><p class="mid muted" style="line-height:1.9;margin:12px 0">家长读出当前任务，孩子在纸书或真实环境中完成。任务不需要全部做完，孩子随时可以换一个。</p><button class="btn btn-green btn-full" data-action="print">🖨️ 打印活动纸＋折叠骰子</button></div><div class="guide-callout"><h3>🌿 今天的学习目标</h3><p>${esc(p.parent_hint)}</p></div><button class="btn btn-outline btn-full" data-view="voice">🎙️ 换成语音引导模式</button><button class="btn btn-white btn-full" data-view="growth">🌱 记录今天的发现</button></div></div></section>`;}
  function voice(){if(!app.approved)return missing('语音游戏需要家长先审核','请先生成活动方案并确认，避免 AI 对孩子讲未经核对的内容。');const p=app.plan;const active=app.voiceStarted&&!app.sessionEnded;const timeLimit=app.voiceSince&&Date.now()-app.voiceSince>4*60*1000;const maxTurn=app.voiceTurns.filter(x=>x.role==='child').length>=8;return `<section class="page"><span class="eyebrow">VOICE TIME / 家长陪同</span><h1 class="hero-title" style="margin:11px 0 7px">和魔法盒聊聊吧 🎙️</h1><p class="muted mid" style="margin-bottom:19px">限定在当前活动的内容；每次最多约4分钟／8轮。没有 API 密钥时提供固定规则演示。</p><div class="voice-layout"><div class="voice-stage"><div class="voice-orb ${app.recording?'recording':app.voiceBusy?'talking':''}" aria-hidden="true">🦊</div><h2>${app.recording?'我在听你说…':app.voiceBusy?'想一想…':active?'小狐狸正在听你':'魔法盒语音小伙伴'}</h2><p>${active?'可以说中文，也可以试着说一点英文。':app.sessionEnded?'本次对话已结束，你可以保存一条成长记录。':'先由家长开启互动，孩子随时可以停止。'}</p><div class="voice-actions"><span class="tag ${app.config.ai_enabled?'':'yellow'}">${app.config.ai_enabled?'AI 接口模式':'演示脚本模式'}</span><span class="tag">⏱️ 4分钟内</span></div></div>${!app.voiceStarted?`<div class="card" style="margin-top:17px"><h3>🔐 家长同意与使用边界</h3><p class="muted mid" style="line-height:1.9;margin:10px 0 15px">开启真实 AI 对话后，麦克风录音将发送到已配置的语音服务处理；不会默认保存原始录音。请勿让孩子透露真实姓名、住址或学校。现在只提供原创小动物音色，不克隆家长或商业角色声音。</p><div class="field"><label for="voice-style">语气偏好（浏览器朗读）</label><select id="voice-style"><option value="fox" ${app.voiceStyle==='fox'?'selected':''}>🦊 活泼小狐狸</option><option value="bear" ${app.voiceStyle==='bear'?'selected':''}>🐻 慢慢小熊</option><option value="gentle" ${app.voiceStyle==='gentle'?'selected':''}>🌷 温柔引导员</option></select></div><label class="checkrow"><input type="checkbox" id="voice-consent" ${app.voiceConsent?'checked':''}/><span>家长已了解语音数据的处理方式，并同意陪同孩子进行短时互动。</span></label><button class="btn btn-primary btn-full" style="margin-top:18px" data-action="voice-start">▶ 开始语音游戏</button></div>`:`<div class="card" style="margin-top:18px"><h3>💬 这次我们说了什么</h3><div class="voice-chat" id="voice-chat" aria-live="polite">${app.voiceTurns.map(t=>`<div class="voice-bubble ${t.role==='child'?'child':'assistant'}"><b>${t.role==='child'?'孩子':'🦊 小狐狸'}：</b>${esc(t.text)}</div>`).join('')}</div>${active&&!timeLimit&&!maxTurn?`<div class="voice-controls"><input id="voice-text" placeholder="孩子可以直接说，也可以输入文字…" maxlength="300" ${app.voiceBusy?'disabled':''}/><button class="btn btn-green" data-action="voice-send" ${app.voiceBusy?'disabled':''}>发送</button></div><div class="toolbar" style="justify-content:center"><button class="btn ${app.recording?'btn-primary':'btn-white'}" data-action="voice-record" ${app.voiceBusy?'disabled':''}>${app.recording?'⏹ 结束录音':'🎤 点击开始录音'}</button><button class="btn btn-outline" data-action="voice-stop">结束本次对话</button></div>`:`<div class="notice-bar">已达到本次对话时长或轮数限制，建议回到实体书继续阅读。</div><div class="toolbar"><button class="btn btn-outline" data-action="voice-stop">结束并记录</button></div>`}<p class="record-hint">${app.config.ai_enabled?'已连接 AI 服务，语音识别和回答会使用服务端接口。':'目前没有配置 AI 密钥。可用文字输入体验预设互动；录音与 AI 自动转写需要先配置服务器。'}</p></div>`}<div class="card" style="margin-top:16px"><h3>🧡 孩子今天的活动</h3><p class="mid muted" style="margin:10px 0;line-height:1.8">${esc(p.title)}</p><p class="mid" style="line-height:1.7">${esc(p.voice_opening)}</p></div>${app.sessionEnded?`<div class="card" style="margin-top:16px"><h3>🌱 生成一条家长可审核的成长记录</h3><p class="muted mid" style="margin:10px 0">对话仅供家长回忆，记录不是自动能力评估。</p><button class="btn btn-primary" data-action="journal-from-voice">编辑成长记录 →</button></div>`:''}</div></section>`;}
  function growth(){return `<section class="page"><span class="eyebrow">LITTLE MOMENTS / 记录成长</span><h1 class="hero-title" style="margin:10px 0 7px">收藏孩子的小小发现 🌱</h1><p class="muted mid" style="margin-bottom:22px">记录真实的参与和想法，不贴能力等级标签；全部内容仅存当前浏览器。</p><div class="form-grid"><div class="card"><h3>📝 写一条阅读日记</h3><p class="muted mid" style="margin:9px 0 18px;line-height:1.7">${app.plan?`今天的活动：${esc(app.plan.title)}`:'可以先选择一个绘本活动。'}</p><p class="field-label" style="margin-bottom:10px">孩子的参与感受</p><div class="mood-row">${['喜欢','一般','不喜欢'].map(m=>`<button class="mood-btn ${app.feedback===m?'selected':''}" data-mood="${m}">${m==='喜欢'?'😍':m==='一般'?'🙂':'😐'} ${m}</button>`).join('')}</div><div class="field"><label for="growth-note">今天值得记下的一句话／一个动作</label><textarea id="growth-note" rows="5" placeholder="例如：孩子听懂 happy 后，主动给玩偶画了一张笑脸。">${esc(app.journalDraft||app.feedbackNote)}</textarea></div><div class="notice-bar">不会自动诊断孩子的学习能力；语音对话记录不会直接变成永久档案，需要家长主动保存。</div><button class="btn btn-primary btn-full" style="margin-top:17px" data-action="save-journal">💚 保存这一天</button></div><div><div class="card" style="background:#edf5ee"><h3>💌 不是考试，是慢慢长大</h3><p class="mid" style="color:#647c6b;line-height:2;margin-top:11px">有人喜欢听故事，有人喜欢演角色，也有人只是想安静地翻书。记录孩子发出的声音、提出的问题和喜欢的玩法，比急着给出能力评分更有意义。</p></div><div class="section-head"><h2 style="font-size:18px">📅 我的成长记录</h2><span class="muted small">${app.journal.length} 条</span></div>${app.journal.length?app.journal.slice().reverse().map((j,i)=>`<div class="card growth-card"><div class="growth-left"><span class="growth-emoji">${j.mood==='喜欢'?'🌞':j.mood==='一般'?'🌤️':'☁️'}</span><div><h3>${esc(j.book||'亲子阅读')}</h3><p>${esc(j.date)} · ${esc(j.mood)}</p><p style="max-width:340px;margin-top:7px;color:#687c71;line-height:1.6">${esc(j.note)}</p></div></div></div>`).join(''):`<div class="empty card" style="padding:35px 18px"><div class="emoji">🌱</div><p>还没有成长记录。读完一本书，再记下一点点发现就好。</p></div>`}</div></div><div class="bottom-actions"><button class="btn btn-outline" data-action="export-data">⬇ 导出我的记录</button><button class="btn btn-text" data-action="delete-data">清空本机记录</button></div></section>`;}
  function missing(h,desc){return `<section class="page"><div class="card empty" style="margin-top:28px"><div class="emoji">✨</div><h2>${esc(h)}</h2><p>${esc(desc)}</p><button class="btn btn-primary" data-view="create">去拍一本绘本 →</button><button class="btn btn-white" style="margin-left:8px" data-action="demo">看原创演示</button></div></section>`;}
  function render(){const sections={home,create,plan:planPage,review:reviewPage,play,voice,growth};$('#root').innerHTML=`<div class="app">${sidebar()}<main class="main">${header()}${(sections[app.view]||home)()}</main></div>`;if(app.view==='voice'){const log=$('#voice-chat');if(log)log.scrollTop=log.scrollHeight;} }

  async function loadDemo(){try{app.loading=true;const p=await api('/api/demo');app.plan=p;app.approved=false;app.voiceStarted=false;app.voiceTurns=[];save();app.view='review';render();notify('已载入原创示范内容，家长审核后即可打印和体验语音。');}catch(e){notify(e.message);}finally{app.loading=false;}}
  async function convertImage(file){return new Promise((resolve,reject)=>{if(!/^image\/(jpeg|png|webp)$/.test(file.type))return reject(new Error('只能选择JPG、PNG或WebP图片'));const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const factor=Math.min(1,1400/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*factor));c.height=Math.max(1,Math.round(img.naturalHeight*factor));c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.76));};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('图片无法识别'));};img.src=url;});}
  async function handleFiles(files){if(!files?.length)return;try{const batch=[...files].slice(0,6);let compressed=[];for(const f of batch){compressed.push(await convertImage(f));}app.images=[...app.images,...compressed].slice(0,6);render();notify(`已加入 ${batch.length} 张书页，确认后生成。`);}catch(e){notify(e.message);}}
  async function generate(){app.bookTitle=$('#book-name')?.value.trim()||'未命名绘本';app.age=$('#age')?.value||'4—5岁';app.goal=$('#goal')?.value||'英语启蒙';app.note=$('#parent-note')?.value||'';if(!app.images.length)return notify('请先拍至少一张清晰书页；也可以点击体验原创演示。');if(!app.config.ai_enabled)return notify('目前未配置服务端 AI 密钥。请先用原创演示体验，或按 README 配置后使用照片生成。');app.loading=true;render();try{const p=await api('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({book_title:app.bookTitle,age:app.age,goal:app.goal,parent_note:app.note,images:app.images})});app.plan=p;app.approved=false;app.voiceStarted=false;app.voiceTurns=[];save();go('review');notify('已生成新方案，请家长先核对书页依据与全部任务。');}catch(e){notify(e.message);go('create');}finally{app.loading=false;render();}}
  function splitLines(id){return ($('#'+id)?.value||'').split(/\n/).map(x=>x.trim()).filter(Boolean);}
  function approve(){if(!$('#adult-confirm')?.checked)return notify('请先确认家长已审核内容且会陪同孩子使用。');const p=clone(app.plan);p.evidence=$('#edit-evidence').value.trim();p.title=$('#edit-title').value.trim();p.game_title=$('#edit-game-title').value.trim();p.intro=$('#edit-intro').value.trim();p.game_materials=$('#edit-materials').value.trim();p.voice_opening=$('#edit-opening').value.trim();p.parent_hint=$('#edit-hint').value.trim();p.questions=splitLines('edit-questions').slice(0,3);p.game_steps=splitLines('edit-steps').slice(0,4);p.vocab=splitLines('edit-vocab').slice(0,4).map(line=>{const a=line.split('|').map(x=>x.trim());return {en:a[0]||'',zh:a[1]||'',action:a[2]||'做一个对应动作'};});const dice=splitLines('edit-dice');if(!p.title||!p.intro||p.vocab.some(x=>!x.en||!x.zh)||p.vocab.length<1||p.questions.length<2||p.game_steps.length<2||dice.length!==6||!p.voice_opening)return notify('请检查：词语至少1条、问题至少2条、游戏至少2步、骰子必须6条，其他内容不能留空。');p.dice_tasks=dice.map((line,i)=>{const [label,...rest]=line.split('|').map(x=>x.trim());return {emoji:app.plan.dice_tasks[i]?.emoji||'✨',label:label||`任务${i+1}`,instruction:rest.join('|')||label||'完成一个小任务'};});app.plan=p;app.approved=true;app.books=[{book_title:p.book_title,goal:p.goal,age:p.age,emoji:'📚',plan:p},...app.books.filter(x=>x.book_title!==p.book_title)].slice(0,30);save();go('plan');notify('家长已确认！现在可以打印、掷骰子和体验语音互动。');}
  function roll(){if(!app.plan)return;const prev=app.dice;app.dice=(prev+1+Math.floor(Math.random()*5))%6;app.diceCount++;render();}
  function printHtml(p){const emojiFor=(text)=>/happy|开心|高兴/i.test(text)?'😊':/sad|难过|伤心/i.test(text)?'😢':/smile|微笑/i.test(text)?'🙂':/jump|跳/i.test(text)?'🐇':/water|水/i.test(text)?'💧':/red|红/i.test(text)?'🔴':/blue|蓝/i.test(text)?'🔵':'✨';const paperHeader=(title,sub)=>`<div class="paper-head"><div class="paper-sub">STORYBOX · 绘本魔法盒 / ${esc(sub)}</div><h1>${esc(title)}</h1><p>${esc(p.book_title)} · ${esc(p.age)} · ${esc(p.goal)}</p></div>`;return `<article class="paper">${paperHeader('家长引导卡','PARENT GUIDE')}<h2>一、先讲故事</h2><p>${esc(p.intro)}</p><h2>二、英语小词语</h2><div class="paper-grid">${p.vocab.map(v=>`<div class="paper-card"><div class="enword">${esc(v.en)}</div><p class="zhword">${esc(v.zh)}｜${esc(v.action)}</p></div>`).join('')}</div><h2>三、自然互动</h2><ol>${p.questions.map(q=>`<li>${esc(q)}</li>`).join('')}</ol><h2>四、离线活动：${esc(p.game_title)}</h2><p><b>准备：</b>${esc(p.game_materials)}</p><ol>${p.game_steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><div class="note-block"><b>给家长的小提示</b><p>${esc(p.parent_hint)}</p></div><div class="paper-footer">家长确认后生成的私人互动材料｜活动原创扩展，不代表原书全文；建议边读实体书边玩。</div></article><article class="paper">${paperHeader('孩子的表情魔法游戏纸','KIDS PLAY SHEET')}<h2>① 听一听，指一指</h2><p>家长说出英语词，孩子指向对应卡片，或尝试做出相关动作（不要求会认读）。</p><div class="paper-grid">${p.vocab.map(v=>`<div class="cutface"><span>${emojiFor(v.en+' '+v.zh)}</span><strong>${esc(v.en)} · ${esc(v.zh)}</strong></div>`).join('')}</div><h2>② 画出今天的心情</h2><p>从今天的故事中选一个词，画一个画面，也可以画下自己最喜欢的部分。</p><div class="drawbox"></div><h2>③ 用玩具讲一讲</h2><p>选择家里一个玩具，为它设计一种心情，讲给家长听。</p><div class="paper-footer">小小提醒：开心和难过都是可以被理解的感受。没有标准答案。</div></article><article class="paper">${paperHeader('六面冒险骰子','CUT & PLAY')}<p>沿六格相连的外轮廓剪下，在格与格之间折叠，用胶带固定边缘；也可以掷实体骰子后按数字领取任务。</p><div class="dice-template">${[null,0,null,null,1,2,3,4,null,5,null,null].map(i=>i===null?'<div class="dice-empty"></div>':`<div class="dice-cell"><span class="em">${esc(p.dice_tasks[i].emoji)}</span><b>${i+1} ${esc(p.dice_tasks[i].label)}</b></div>`).join('')}</div><h2>骰子任务清单</h2><ol>${p.dice_tasks.map(t=>`<li><b>${esc(t.label)}：</b>${esc(t.instruction)}</li>`).join('')}</ol><div class="note-block"><b>家长提示</b><p>每次只完成一项。孩子如果想换任务、停下来或继续看书，都可以。</p></div><div class="paper-footer">适合A4打印｜折叠骰子为辅助，建议由家长剪裁。</div></article>`;}
  function doPrint(){if(!app.approved)return notify('请先通过家长审核，再打印。');$('#print-root').innerHTML=printHtml(app.plan);window.print();}
  function browserSpeak(text){if(!('speechSynthesis' in window))return notify('此浏览器不支持朗读。你仍可阅读屏幕上的文字。');try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=app.voiceStyle==='bear'?.78:app.voiceStyle==='gentle'?.86:.96;u.pitch=app.voiceStyle==='fox'?1.22:app.voiceStyle==='gentle'?1.0:.85;const voices=speechSynthesis.getVoices();const zh=voices.find(v=>/zh|chinese/i.test(v.lang||v.name));if(zh)u.voice=zh;speechSynthesis.speak(u);}catch(e){notify('设备语音暂不可用，可继续使用文字互动。');}}
  async function speak(text){if(!app.config.ai_enabled){browserSpeak(text);return;}try{const res=await fetch('/api/voice/speak',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});if(!res.ok)throw new Error('voice failed');const url=URL.createObjectURL(await res.blob());const a=new Audio(url);app.currentAudio=a;a.onended=()=>{URL.revokeObjectURL(url);if(app.currentAudio===a)app.currentAudio=null;};await a.play();}catch(e){browserSpeak(text);}}
  async function voiceStart(){if(!app.voiceConsent)return notify('请先阅读并勾选监护人同意。');app.voiceStarted=true;app.sessionEnded=false;app.voiceSince=Date.now();app.voiceTurns=[{role:'assistant',text:app.plan.voice_opening}];render();await speak(app.plan.voice_opening);}
  async function voiceSend(text){text=(text||'').trim().slice(0,300);if(!text||app.voiceBusy||app.sessionEnded)return;if(app.voiceTurns.filter(x=>x.role==='child').length>=8){voiceStop();return;}if(Date.now()-app.voiceSince>4*60*1000){voiceStop();return;}app.voiceBusy=true;app.voiceTurns.push({role:'child',text});render();try{const result=await api('/api/voice/reply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({plan:app.plan,child_text:text,turns:app.voiceTurns.slice(-8)})});app.voiceTurns.push({role:'assistant',text:result.reply});}catch(e){app.voiceTurns.push({role:'assistant',text:'好像有点听不清，我们可以回到绘本，或者晚一点再继续玩。'});notify(e.message);}finally{app.voiceBusy=false;render();await speak(app.voiceTurns[app.voiceTurns.length-1].text);}}
  function voiceStop(){app.sessionEnded=true;if(app.recording)stopRecording();if(app.currentAudio){app.currentAudio.pause();app.currentAudio=null;}if('speechSynthesis' in window)speechSynthesis.cancel();app.voiceBusy=false;render();}
  async function startRecording(){if(!app.config.ai_enabled)return notify('真实录音转写需要先在服务器配置 OPENAI_API_KEY。演示模式请使用文字输入。');if(!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder)return notify('浏览器不支持录音，请改用文字输入；手机上需 HTTPS 或 localhost。');try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});const supported=['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg'].find(m=>MediaRecorder.isTypeSupported(m));const rec=supported?new MediaRecorder(stream,{mimeType:supported}):new MediaRecorder(stream);app.stream=stream;app.recorder=rec;const chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};rec.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());app.recording=false;if(app.sessionEnded){render();return;}render();const blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});const ext=blob.type.includes('mp4')?'m4a':blob.type.includes('ogg')?'ogg':'webm';const form=new FormData();form.append('file',blob,`child-voice.${ext}`);try{app.voiceBusy=true;render();const r=await api('/api/voice/transcribe',{method:'POST',body:form});app.voiceBusy=false;await voiceSend(r.text);}catch(e){app.voiceBusy=false;render();notify(e.message);}};rec.start();app.recording=true;render();}catch(e){notify('麦克风未授权或不可用，可以改用文字输入。');}}
  function stopRecording(){if(app.recorder&&app.recorder.state==='recording')app.recorder.stop();app.recording=false;}
  function journalVoice(){const childs=app.voiceTurns.filter(x=>x.role==='child').slice(-3).map(x=>x.text);app.journalDraft=childs.length?`这次互动中，孩子说了：“${childs.join('；')}”。（请家长补充真实观察与感受）`:'这次进行了短时语音互动。（请家长补充真实观察与感受）';go('growth');}
  function saveJournal(){const note=$('#growth-note')?.value.trim()||'';if(!note)return notify('先记下一句孩子说的话，或一次真实的参与吧。');app.journal.push({date:new Date().toLocaleDateString('zh-CN'),mood:app.feedback,book:app.plan?.book_title||'亲子阅读',note:note.slice(0,1000)});app.journalDraft='';app.feedbackNote='';save();render();notify('已保存到当前浏览器的成长记录。');}
  function exportData(){const data=JSON.stringify({version:'0.1',books:app.books.map(x=>({book_title:x.book_title,goal:x.goal,age:x.age})),journal:app.journal},null,2);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download='绘本魔法盒-成长记录.json';a.click();URL.revokeObjectURL(a.href);}
  async function deleteData(){if(!window.confirm('清空当前设备保存的绘本、活动和成长记录？此操作无法撤销。'))return;localStorage.removeItem(STORE_KEY);Object.assign(app,{books:[],journal:[],plan:null,approved:false,voiceTurns:[],voiceStarted:false,images:[]});go('home');notify('本机记录已清空。');}
  document.addEventListener('click',async e=>{const btn=e.target.closest('button');if(!btn)return;const view=btn.dataset.view;if(view){if(['plan','play','voice'].includes(view)&&!app.plan)return go('create');return go(view);}const action=btn.dataset.action;if(!action)return;switch(action){case'demo':return loadDemo();case'clear-images':app.images=[];render();return;case'generate':return generate();case'edit-plan':return go('review');case'approve':return approve();case'roll':return roll();case'print':return doPrint();case'voice-start':return voiceStart();case'voice-send':return voiceSend($('#voice-text')?.value);case'voice-record':return app.recording?stopRecording():startRecording();case'voice-stop':return voiceStop();case'journal-from-voice':return journalVoice();case'save-journal':return saveJournal();case'export-data':return exportData();case'delete-data':return deleteData();}});
  document.addEventListener('change',e=>{if(e.target.id==='book-photo')handleFiles(e.target.files);if(e.target.id==='age')app.age=e.target.value;if(e.target.id==='goal')app.goal=e.target.value;if(e.target.id==='voice-consent')app.voiceConsent=e.target.checked;if(e.target.id==='voice-style')app.voiceStyle=e.target.value;});
  document.addEventListener('click',e=>{const mood=e.target.closest('[data-mood]');if(mood){app.feedback=mood.dataset.mood;const typed=$('#growth-note')?.value||'';app.feedbackNote=typed;render();}const book=e.target.closest('[data-book]');if(book){const item=app.books[Number(book.dataset.book)];if(!item?.plan)return;app.plan=item.plan;app.approved=true;save();go('plan');}});
  document.addEventListener('input',e=>{if(e.target.id==='book-name')app.bookTitle=e.target.value;if(e.target.id==='parent-note')app.note=e.target.value;});
  document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='voice-text'){e.preventDefault();voiceSend(e.target.value);}});
  function init(){render();fetch('/api/config').then(r=>r.json()).then(r=>{app.config=r;render();}).catch(()=>{});if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('/sw.js').catch(()=>{});}
  init();
})();

</script>
</body>
</html>
